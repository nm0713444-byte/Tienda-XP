name: Pruebas de Tienda XP

on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ejecutar pruebas
        run: node pruebas.js